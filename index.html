<script>
const KEY='sifer360_v1';
const seed={
config:{empresa:'',moneda:'USD',impuesto:16,bcv:{rate:0,effectiveDate:null,updatedAt:null,source:'',status:'pending'},bcvHistory:[]},
productos:[],
clientes:[],
proveedores:[],
ventas:[],compras:[],cxc:[],cxp:[],presupuestos:[],movimientos:[],pedidos:[],usuarios:[{id:'USR-001',nombre:'Administrador',rol:'Administrador',activo:true,cajaId:'CAJA-01'}],cajas:[{id:'CAJA-01',nombre:'Caja 1',abierta:false,saldo:0,apertura:null,ultimoCorteAt:null,cortes:[],seqVenta:1,seqDevolucion:1,seqZ:1}],caja:{abierta:false,saldo:0,apertura:null,ultimoCorteAt:null,cortes:[]},terminalId:'CAJA-01',usuarioActualId:'USR-001',seq:{venta:1,compra:1,presupuesto:1,cxc:1,cxp:1,cliente:2,proveedor:2,producto:7,pedido:1,usuario:2,caja:2}
};
let db=load(); Object.defineProperty(window,'db',{configurable:true,get:()=>db,set:v=>{db=v;}}); let view='inicio'; let selected=null; let cart=[]; let saleCustomer=''; let saleType='contado'; let tax2=false; let bcvRefreshInFlight=false; let activeOrderId=null;
function cleanDemoState(d){
  d=d&&typeof d==='object'?d:structuredClone(seed);
  d.config=d.config||structuredClone(seed.config);
  const demoProductIds=new Set(['PR-001','PR-002','PR-003','PR-004','PR-005','PR-006']);
  d.productos=(Array.isArray(d.productos)?d.productos:[]).filter(p=>{
    if(demoProductIds.has(String(p.id||'')))return false;
    const oem=String(p.codigoOEM||''),code=String(p.codigo||p.sku||'');
    return !/^REF-PENDIENTE-|^(OIL-PUMP|ADD-|OIL-PICKUP|OIL-RELIEF|OIL-COOLER|OIL-SWITCH|OIL-DIPSTICK|OIL-CAP)/i.test(oem)&&!/REF-PENDIENTE|^DEMO-|^TEST-/i.test(code);
  });
  d.clientes=(Array.isArray(d.clientes)?d.clientes:[]).filter(c=>String(c.id||'')!=='CL-001'&&!/constructora central/i.test(String(c.nombre||''))&&!/\.local$/i.test(String(c.email||''))&&String(c.documento||'')!=='J-00000001');
  d.proveedores=(Array.isArray(d.proveedores)?d.proveedores:[]).filter(p=>String(p.id||'')!=='PV-001'&&!/distribuidora ferretera nacional/i.test(String(p.nombre||''))&&!/\.local$/i.test(String(p.email||''))&&String(p.documento||'')!=='J-10000001');
  d.compras=(Array.isArray(d.compras)?d.compras:[]).filter(x=>!['CMP-00001','CMP-00002'].includes(String(x.numero||x.documento||'')));
  d.cxp=(Array.isArray(d.cxp)?d.cxp:[]).filter(x=>!['CMP-00001','CMP-00002'].includes(String(x.numero||x.documento||'')));
  if(!localStorage.getItem('sifer360_demo_cleanup_v1')){
    d.ventas=(Array.isArray(d.ventas)?d.ventas:[]);
    if(d.ventas.length===2 && Math.abs(d.ventas.reduce((sum,x)=>sum+Number(x.total||0),0)-75.97)<0.02)d.ventas=[];
    d.compras=(Array.isArray(d.compras)?d.compras:[]);
    d.cxc=Array.isArray(d.cxc)?d.cxc:[];
    d.presupuestos=Array.isArray(d.presupuestos)?d.presupuestos:[];
    d.movimientos=Array.isArray(d.movimientos)?d.movimientos:[];
    d.pedidos=Array.isArray(d.pedidos)?d.pedidos:[];
    localStorage.setItem('sifer360_demo_cleanup_v1','done');
  }
  d.cajas=Array.isArray(d.cajas)&&d.cajas.length?d.cajas:[structuredClone(seed.cajas[0])];
  d.terminalId=d.terminalId||'CAJA-01';d.usuarioActualId=d.usuarioActualId||'USR-001';
  d.usuarios=Array.isArray(d.usuarios)&&d.usuarios.length?d.usuarios:structuredClone(seed.usuarios);
  d.pedidos=Array.isArray(d.pedidos)?d.pedidos:[];
  if(d.config.bcv?.status==='demo'||Number(d.config.bcv?.rate)===814.6908||String(d.config.bcv?.source||'').includes('bcv.today')){d.config.bcv={rate:0,effectiveDate:null,updatedAt:null,source:'',status:'pending'};d.config.bcvHistory=[];}else{d.config.bcv=d.config.bcv||structuredClone(seed.config.bcv);d.config.bcvHistory=Array.isArray(d.config.bcvHistory)?d.config.bcvHistory:[];}
  if(!d.config.impuesto||d.config.impuesto===7)d.config.impuesto=16;
  d.seq=d.seq||structuredClone(seed.seq);
  return d;
}
function load(){try{const raw=localStorage.getItem(KEY);const d=cleanDemoState(raw?JSON.parse(raw):structuredClone(seed));localStorage.setItem(KEY,JSON.stringify(d));return d}catch(e){return cleanDemoState(structuredClone(seed))}}
function save(reason='db-save'){localStorage.setItem(KEY,JSON.stringify(db)); if(window.SiferOffline) window.SiferOffline.persist(db,reason).catch(()=>{});}
window.addEventListener('sifer:turso-hydrated',()=>{try{const raw=localStorage.getItem(KEY);if(raw){db=cleanDemoState(JSON.parse(raw));localStorage.setItem(KEY,JSON.stringify(db));renderShell();}}catch(e){}});
function cajaActual(){if(!Array.isArray(db.cajas)||!db.cajas.length)db.cajas=structuredClone(seed.cajas);const u=usuarioActual();if(u.rol==='Administrador'){const admin=db.cajas.find(x=>x.id==='CAJA-01')||structuredClone(seed.cajas[0]);db.terminalId='CAJA-01';return admin}if(u.rol==='Cajero'&&u.cajaId){const assigned=db.cajas.find(x=>x.id===u.cajaId);if(assigned){db.terminalId=assigned.id;return assigned}}let c=db.cajas.find(x=>x.id===db.terminalId);if(!c){c=structuredClone(db.cajas[0]);db.terminalId=c.id}return c}
function usuarioActual(){return (db.usuarios||[]).find(x=>x.id===db.usuarioActualId)||db.usuarios?.[0]||{nombre:'Administrador',rol:'Administrador'}}
async function reserveDocumentNumber(kind){
  const c=cajaActual();
  if(!navigator.onLine){
    throw new Error('No hay conexión con Turso. La numeración de ventas, devoluciones y cortes Z requiere conexión para evitar duplicados.');
  }
  try{
    const r=await fetch('/api/turso-sequence',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({cajaId:c.id,tipo:kind})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok||!data.ok)throw new Error(data.error||'No se pudo reservar numeración en Turso');
    return data.documento;
  }catch(e){
    const msg=String(e?.message||e);
    toast('No se puede completar la operación: Turso no está disponible.');
    throw new Error('Numeración no disponible en Turso. La operación fue detenida para proteger la numeración: '+msg);
  }
}
function money(n){return new Intl.NumberFormat('es-US',{style:'currency',currency:db.config.moneda}).format(Number(n)||0)}
function id(prefix,key){let n=db.seq[key]++;return prefix+'-'+String(n).padStart(5,'0')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1900)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(d=new Date()){return d.toLocaleString('es-ES')}
function fmtDate(d){if(!d)return '—';try{return new Date(d+'T00:00:00').toLocaleDateString('es-VE')}catch(e){return d}}
function fmtRate(n){return Number(n||0).toLocaleString('es-VE',{minimumFractionDigits:4,maximumFractionDigits:8})}
function bcvData(){return db.config.bcv||{rate:0,effectiveDate:null,updatedAt:null,source:'https://bcv.today/api/v1/rate.json',status:'sin datos',autoSaved:true}}
function bcvSource(){return 'https://bcv.today/api/v1/rate.json'}
function bcvFallbackSource(){return 'https://pydolarvenezuela-api.vercel.app/api/v1/dollar?page=bcv'}
function bcvHistory(){if(!Array.isArray(db.config.bcvHistory))db.config.bcvHistory=[];return db.config.bcvHistory}

function ensureBCVHistory(customEntry=null){
  const b=bcvData(), h=bcvHistory();
  const entry = customEntry || (b.rate && b.effectiveDate ? {
    effectiveDate: b.effectiveDate,
    rate: Number(b.rate),
    updatedAt: b.updatedAt || new Date().toISOString(),
    source: b.source || bcvSource(),
    tipo: b.status === 'live' ? '⚡ Auto-Guardado Diario' : '💾 Guardado Local'
  } : null);

  if(!entry || !entry.rate || !entry.effectiveDate) return;

  const idx = h.findIndex(x => x.effectiveDate === entry.effectiveDate);
  if(idx >= 0){
    h[idx] = {...h[idx], ...entry};
  } else {
    h.unshift(entry);
  }

  // Ordenar cronológicamente descendente
  h.sort((a,b) => new Date(b.effectiveDate || 0).getTime() - new Date(a.effectiveDate || 0).getTime());

  // Calcular variaciones porcentuales diarias
  for(let i=0; i<h.length; i++){
    if(i < h.length - 1 && h[i+1]?.rate){
      const prev = Number(h[i+1].rate);
      const curr = Number(h[i].rate);
      const diff = ((curr - prev) / prev) * 100;
      h[i].variacion = diff;
    } else {
      h[i].variacion = 0;
    }
  }

  db.config.bcvHistory = h.slice(0, 365);
}

function bcvPanel(){
  const b=bcvData();
  const h=bcvHistory();
  const todayEntry = h.find(x => x.effectiveDate === b.effectiveDate);
  const varPct = todayEntry?.variacion || 0;
  const varColor = varPct > 0 ? '#cf1322' : (varPct < 0 ? '#389e0d' : '#555');
  const varSign = varPct > 0 ? '▲ +' : (varPct < 0 ? '▼ ' : '');

  return `<div class="panel"><div class="panelhead" style="display:flex;justify-content:space-between;align-items:center">
    <span>Control de Tasa BCV Oficial y Auto-Guardado Diario</span>
    <span class="badge ok" style="font-size:10px;padding:3px 8px">🟢 Auto-guardado diario activo (${h.length} días)</span>
  </div><div class="panelbody"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap"><div>
    <div style="font-size:11px;color:#666;text-transform:uppercase">Tasa BCV vigente consultada</div>
    <div style="font-size:28px;font-weight:800;color:#0b4f85;margin:3px 0">${fmtRate(b.rate)} <span style="font-size:15px;color:#555">Bs/USD</span>
      ${varPct !== 0 ? `<span style="font-size:13px;font-weight:bold;color:${varColor};margin-left:6px">${varSign}${varPct.toFixed(2)}%</span>` : ''}
    </div>

function downloadBCVHistoryCSV(){
  const h = bcvHistory();
  if(!h.length) return toast('No hay histórico para exportar');
  let csv = 'Fecha_Valor,Tasa_VES_USD,Variacion_Porcentaje,Tipo_Registro,Fecha_Hora_Captura,Fuente\n';
  h.forEach(x => {
    csv += `"${x.effectiveDate || ''}","${Number(x.rate || 0).toFixed(4)}","${(Number(x.variacion) || 0).toFixed(2)}%","${x.tipo || 'Auto'}","${x.updatedAt || ''}","${x.source || ''}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Historico_Tasas_BCV_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Histórico BCV descargado');
}

async function updateBCVRate(silent=false){
  const b=bcvData();
  try{
    if(!silent) toast('Consultando y guardando tasa BCV oficial…');
    let rate = 0;
    let effectiveDate = new Date().toISOString().slice(0,10);
    let captured = new Date().toISOString();
    let sourceUsed = bcvSource();

    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      const r = await fetch(bcvSource(), { cache: 'no-store', signal: controller.signal });
      clearTimeout(timeout);
      if(r.ok) {
        const data = await r.json();
        rate = Number(data.USD);
        effectiveDate = data.effective_date || data.date || effectiveDate;
        captured = data.updated_at || captured;
      }
    } catch(errPrimary) {
      // Intentar fallback si falla el principal
      try {
        const controller2 = new AbortController();
        const timeout2 = setTimeout(() => controller2.abort(), 8000);
        const r2 = await fetch(bcvFallbackSource(), { cache: 'no-store', signal: controller2.signal });
        clearTimeout(timeout2);
        if(r2.ok) {
          const data2 = await r2.json();
          rate = Number(data2?.monitors?.usd?.price || data2?.bcv?.price || 0);
          effectiveDate = data2?.monitors?.usd?.last_update?.slice(0,10) || effectiveDate;
          sourceUsed = bcvFallbackSource();
        }
      } catch(errSec) {
        // Fallback handled below
      }
    }

    if(!Number.isFinite(rate) || rate <= 0) {
      throw new Error('Respuesta BCV inválida');
    }

    const changed = Number(b.rate) !== rate || b.effectiveDate !== effectiveDate;
    db.config.bcv = {
      rate,
      effectiveDate,
      updatedAt: captured,
      source: sourceUsed,
      status: 'live',
      autoSaved: true
    };

    ensureBCVHistory({
      effectiveDate,
      rate,
      updatedAt: captured,
      source: sourceUsed,
      tipo: '⚡ Auto-Guardado Diario'
    });

    save();
    if(!silent) {
      closeModal();
      renderView();
      toast(changed ? `Tasa BCV del día guardada: ${fmtRate(rate)} Bs/USD` : `Tasa BCV al día (${fmtRate(rate)} Bs/USD)`);
    } else if(changed) {
      renderView();
    }
  }catch(e){
    db.config.bcv = {...b, status: 'offline'};
    ensureBCVHistory();
    save();
    if(!silent) toast('No se pudo conectar con el servicio BCV. Se conserva la última tasa guardada.');
  }
}

function maybeRefreshBCV(){
  if(bcvRefreshInFlight) return;
  const b=bcvData();
  const todayStr = new Date().toLocaleDateString('en-CA');
  const h = bcvHistory();
  const hasToday = h.some(x => x.effectiveDate === todayStr || x.effectiveDate === b.effectiveDate);
  const age = b.updatedAt ? Date.now() - new Date(b.updatedAt).getTime() : Infinity;

  // Auto-guardar si no existe la tasa de hoy o si han pasado más de 30 minutos
  if(!b.rate || !hasToday || age > 30 * 60 * 1000) {
    bcvRefreshInFlight = true;
    updateBCVRate(true).finally(() => { bcvRefreshInFlight = false; });
  }
}

function productosView(){

  for (const p of productos) {

    else inventarioMap.set(key,{...existing,stock:Number(existing.stock ?? r.stock ?? 0)});

  return listPage(

      <div class="card">Existencias<b>${totalUnidades}</b><span>unidades registradas</span></div>
      <div class="card">Stock bajo<b>${bajos}</b><span>requieren reposición</span></div>
    </div>
    <div class="searchbar"><input placeholder="🔍 Buscar por nombre, SKU, OEM, marca, categoría o ubicación..." oninput="filterTable(this,'unifiedInventoryTable')"></div>
    <div class="panel"><div class="panelhead">Inventario real de SIFER — no incluye referencias solamente consultadas del Catálogo Máster</div>
      <div class="panelbody" style="padding:0;overflow:auto">
        <table id="unifiedInventoryTable">
          <thead><tr>
            <th>Origen</th><th>SKU / Código</th><th>Producto / Repuesto</th><th>Categoría</th><th>Marca</th><th>Ubicación</th><th>Costo</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acción</th>
          </tr></thead>
          <tbody>
            ${inventario.map(p=>`<tr>
              <td><span class="badge ${p._source==='Repuesto'?'ok':''}">${p._source}</span></td>
              <td><b style="font-family:monospace;font-size:10px">${esc(p.codigo||p.sku||p.id)}</b><br><small>${esc(p.codigoOEM||'—')}</small></td>
              <td><b>${esc(p.nombre)}</b><br><small>${esc(p.unidad||'Unidad')}</small></td>
              <td>${esc(p.categoria||'—')}</td>
              <td>${esc(p.marca||'Genérica')}</td>
              <td>${esc(p.ubicacion||'Almacén')}</td>
              <td>${money(p.costo)}</td>
              <td><b>${money(p.precio)}</b></td>
              <td class="num"><b>${Number(p.stock||0)}</b></td>

function updateEditProductPricing(){
  let c = Number(document.getElementById('pCosto')?.value) || 0;
  if(c > 0){
    let detal = (c * 1.35).toFixed(2);
    let taller = (c * 1.20).toFixed(2);
    let mayor = (c * 1.12).toFixed(2);
    let elP = document.getElementById('pPrecio');
    let elPT = document.getElementById('pPrecioTaller');
    let elPM = document.getElementById('pPrecioMayor');
    if(elP) elP.value = detal;
    if(elPT) elPT.value = taller;
    if(elPM) elPM.value = mayor;
  }
}

function quoteToSale(num){

  for(const l of q.lineas||[]){

function cajaPeriodoMovimientos(){
  const since=cajaActual().ultimoCorteAt?new Date(cajaActual().ultimoCorteAt).getTime():0;
  return db.movimientos.filter(x=>{const t=new Date(x.fecha).getTime();return !since||Number.isNaN(t)||t>=since;});
}
function cajaResumen(){
  const since=cajaActual().ultimoCorteAt?new Date(cajaActual().ultimoCorteAt).getTime():0;
  const inPeriod=x=>{const t=new Date(x.fecha).getTime();return !since||Number.isNaN(t)||t>=since;};
  const ventas=db.ventas.filter(inPeriod),movs=db.movimientos.filter(inPeriod);
  const contado=ventas.filter(v=>v.tipo==='contado').reduce((s,v)=>s+(v.pagado||0),0);
  const credito=ventas.filter(v=>v.tipo==='credito').reduce((s,v)=>s+v.total,0);
  const devol=ventas.filter(v=>v.tipo==='devolucion').reduce((s,v)=>s+Math.abs(v.total),0);
  const cobros=movs.filter(x=>x.tipo==='Cobro CxC').reduce((s,x)=>s+Number(x.monto||0),0);
  const compras=movs.filter(x=>x.tipo==='Compra').reduce((s,x)=>s+Number(x.monto||0),0);
  const pagos=movs.filter(x=>x.tipo==='Pago CxP').reduce((s,x)=>s+Number(x.monto||0),0);
  return {ventas,contado,credito,devol,cobros,compras,pagos};
}

async function syncOrdersFromTurso(){
 if(!navigator.onLine)return;
 try{
   const r=await fetch('/api/turso-orders',{cache:'no-store'});
   if(!r.ok)return;
   const data=await r.json(); if(!data.ok||!Array.isArray(data.orders))return;
   let changed=false;
   const remoteMap=new Map(data.orders.map(x=>[String(x.id),x]));
   db.pedidos=(db.pedidos||[]).map(local=>{
     const x=remoteMap.get(String(local.id)); if(!x)return local;
     let payload={}; try{payload=JSON.parse(x.payload_json||'{}')}catch(e){}
     const next={...local,...payload,estado:x.estado,cajaId:x.caja_id||local.cajaId,claimedBy:x.claimed_by||null,claimedAt:x.claimed_at||null,updatedAt:x.updated_at||local.updatedAt,saleNumber:payload.saleNumber||local.saleNumber};
     if(JSON.stringify(next)!==JSON.stringify(local)){changed=true;return next} return local;
   });
   if(changed){
     localStorage.setItem(KEY,JSON.stringify(db));
     if(view==='pedidos')renderView();
   }
 }catch(e){}
}

function normalizeSearchText(s){return s?String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''):''}
function matchKeywords(text,query){if(!query||!query.trim())return true;if(!text)return false;const normText=normalizeSearchText(text),tokens=normalizeSearchText(query).trim().split(/\s+/).filter(Boolean);return tokens.every(t=>normText.includes(t))}
