<script>
const KEY='sifer360_v1';
const seed={
config:{empresa:'SIFER 360',moneda:'USD',impuesto:7,bcv:{rate:814.6908,effectiveDate:'2026-09-08',updatedAt:'2026-09-08T07:23:30-04:00',source:'https://bcv.today/api/v1/rate.json',status:'demo'},bcvHistory:[{effectiveDate:'2026-09-08',rate:814.6908,updatedAt:'2026-09-08T07:23:30-04:00',source:'https://bcv.today/api/v1/rate.json'},{effectiveDate:'2026-09-07',rate:813.7361,updatedAt:'2026-09-07T19:33:57-04:00',source:'https://bcv.today/api/v1/rate.json'}]},
productos:[
{id:'PR-001',codigo:'750001',nombre:'Taladro inalámbrico 20V',categoria:'Herramientas',marca:'ProTool',unidad:'Unidad',costo:75,precio:129.99,stock:18,min:5,imagen:'/images/prod_taladro_inalambrico_1791152564948.jpg'},
{id:'PR-002',codigo:'750002',nombre:'Guantes de seguridad reforzados',categoria:'Seguridad',marca:'SafePro',unidad:'Par',costo:8,precio:14.99,stock:45,min:10,imagen:'/images/prod_guantes_seguridad_1791152574833.jpg'},
{id:'PR-003',codigo:'750003',nombre:'Tornillo hexagonal 1/4 x 2"',categoria:'Tornillería',marca:'Sifer',unidad:'Caja',costo:18,precio:32.5,stock:12,min:4,imagen:'/images/prod_tornillo_hexagonal_1791152584594.jpg'},
{id:'PR-004',codigo:'750004',nombre:'Pintura acrílica blanca 1 galón',categoria:'Pinturas',marca:'ColorMax',unidad:'Galón',costo:22,precio:39.95,stock:7,min:3,imagen:'/images/prod_pintura_galon_1791152594128.jpg'},
{id:'PR-005',codigo:'750005',nombre:'Cemento gris 42.5 kg',categoria:'Construcción',marca:'Andino',unidad:'Saco',costo:7.5,precio:11.95,stock:50,min:12,imagen:'/images/prod_cemento_saco_1791152604023.jpg'},
{id:'PR-006',codigo:'750006',nombre:'Cable eléctrico 12 AWG',categoria:'Electricidad',marca:'ElectroMax',unidad:'Rollo',costo:42,precio:69.9,stock:9,min:3,imagen:'/images/prod_cable_electrico_1791152613266.jpg'}
],
clientes:[{id:'CL-001',nombre:'Constructora Central',documento:'J-00000001',telefono:'555-0101',email:'compras@constructora.local',direccion:'Av. Principal 100',limite:5000,saldo:0}],
proveedores:[{id:'PV-001',nombre:'Distribuidora Ferretera Nacional',documento:'J-10000001',telefono:'555-0202',email:'ventas@distribuidora.local',direccion:'Zona Industrial',saldo:0}],
ventas:[],compras:[],cxc:[],cxp:[],presupuestos:[],movimientos:[],caja:{abierta:false,saldo:0,apertura:null,ultimoCorteAt:null,cortes:[]},seq:{venta:1,compra:1,presupuesto:1,cxc:1,cxp:1,cliente:2,proveedor:2,producto:7}
};
let db=load(); let view='inicio'; let selected=null; let cart=[]; let saleCustomer='CL-001'; let saleType='contado'; let tax2=false; let bcvRefreshInFlight=false;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed);d.config=d.config||structuredClone(seed.config);if(!d.config.bcv)d.config.bcv=structuredClone(seed.config.bcv);if(!Array.isArray(d.config.bcvHistory))d.config.bcvHistory=[];if(Array.isArray(d.productos)){d.productos.forEach((p,i)=>{if(!p.imagen&&seed.productos[i]?.imagen)p.imagen=seed.productos[i].imagen;});}return d}catch(e){return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db)); if(window.SiferOffline) window.SiferOffline.persist(db,'db-save').catch(()=>{});}
window.addEventListener('sifer:turso-hydrated',()=>{try{const raw=localStorage.getItem(KEY);if(raw){db=JSON.parse(raw);renderShell();}}catch(e){}});
function money(n){return new Intl.NumberFormat('es-US',{style:'currency',currency:db.config.moneda}).format(Number(n)||0)}
function id(prefix,key){let n=db.seq[key]++;return prefix+'-'+String(n).padStart(5,'0')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1900)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(d=new Date()){return d.toLocaleString('es-ES')}
function fmtDate(d){if(!d)return '—';try{return new Date(d+'T00:00:00').toLocaleDateString('es-VE')}catch(e){return d}}
function fmtRate(n){return Number(n||0).toLocaleString('es-VE',{minimumFractionDigits:4,maximumFractionDigits:8})}
function bcvData(){return db.config.bcv||{rate:0,effectiveDate:null,updatedAt:null,source:'https://bcv.today/api/v1/rate.json',status:'sin datos',autoSaved:true}}
function bcvSource(){return 'https://bcv.today/api/v1/rate.json'}
function bcvFallbackSource(){return 'https://pydolarvenezuela-api.vercel.app/api/v1/dollar?page=bcv'}
function bcvHistory(){if(!Array.isArray(db.config.bcvHistory))db.config.bcvHistory=[];return db.config.bcvHistory}

function ensureBCVHistory(customEntry=null){
  const b=bcvData(), h=bcvHistory();
  const entry = customEntry || (b.rate && b.effectiveDate ? {
    effectiveDate: b.effectiveDate,
    rate: Number(b.rate),
    updatedAt: b.updatedAt || new Date().toISOString(),
    source: b.source || bcvSource(),
    tipo: b.status === 'live' ? '⚡ Auto-Guardado Diario' : '💾 Guardado Local'
  } : null);

  if(!entry || !entry.rate || !entry.effectiveDate) return;

  const idx = h.findIndex(x => x.effectiveDate === entry.effectiveDate);
  if(idx >= 0){
    h[idx] = {...h[idx], ...entry};
  } else {
    h.unshift(entry);
  }

  // Ordenar cronológicamente descendente
  h.sort((a,b) => new Date(b.effectiveDate || 0).getTime() - new Date(a.effectiveDate || 0).getTime());

  // Calcular variaciones porcentuales diarias
  for(let i=0; i<h.length; i++){
    if(i < h.length - 1 && h[i+1]?.rate){
      const prev = Number(h[i+1].rate);
      const curr = Number(h[i].rate);
      const diff = ((curr - prev) / prev) * 100;
      h[i].variacion = diff;
    } else {
      h[i].variacion = 0;
    }
  }

  db.config.bcvHistory = h.slice(0, 365);
}

function bcvPanel(){
  const b=bcvData();
  const h=bcvHistory();
  const todayEntry = h.find(x => x.effectiveDate === b.effectiveDate);
  const varPct = todayEntry?.variacion || 0;
  const varColor = varPct > 0 ? '#cf1322' : (varPct < 0 ? '#389e0d' : '#555');
  const varSign = varPct > 0 ? '▲ +' : (varPct < 0 ? '▼ ' : '');

  return `<div class="panel"><div class="panelhead" style="display:flex;justify-content:space-between;align-items:center">
    <span>Control de Tasa BCV Oficial y Auto-Guardado Diario</span>
    <span class="badge ok" style="font-size:10px;padding:3px 8px">🟢 Auto-guardado diario activo (${h.length} días)</span>
  </div><div class="panelbody"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap"><div>
    <div style="font-size:11px;color:#666;text-transform:uppercase">Tasa BCV vigente consultada</div>
    <div style="font-size:28px;font-weight:800;color:#0b4f85;margin:3px 0">${fmtRate(b.rate)} <span style="font-size:15px;color:#555">Bs/USD</span>
      ${varPct !== 0 ? `<span style="font-size:13px;font-weight:bold;color:${varColor};margin-left:6px">${varSign}${varPct.toFixed(2)}%</span>` : ''}
    </div>
    <div style="font-size:11px;color:#444">Fecha Valor: <b>${fmtDate(b.effectiveDate)}</b> · Captura automática: <b>${b.updatedAt?fmt(new Date(b.updatedAt)):'—'}</b></div>
    <div style="font-size:10px;color:#777;margin-top:2px">Sincronización diaria automática programada cada 15 min · Registrado en base histórica local</div>
  </div><div class="actions" style="margin:0;display:flex;gap:6px;align-items:center">
    <button class="btn primary" onclick="updateBCVRate()">↻ Sincronizar BCV</button>
    <button class="btn" onclick="showBCVHistory()">📜 Ver Histórico Diario</button>
  </div></div></div></div>`;
}

function showBCVHistory(){
  ensureBCVHistory();
  const h=bcvHistory();
  openModal('📜 Histórico de Tasas Diarias BCV Guardadas Automáticamente', `
    <div style="display:flex;justify-content:space-between;align-items:center;background:#f5f8fb;padding:8px 10px;border:1px solid #d0dbe8;border-radius:4px;margin-bottom:8px">
      <div style="font-size:11px;color:#333">
        <b>Registro histórico permanente:</b> ${h.length} días almacenados localmente de forma automática.
      </div>
      <button class="btn" style="font-size:10px;padding:4px 8px" onclick="downloadBCVHistoryCSV()">📥 Exportar Histórico (CSV)</button>
    </div>
    <div style="max-height:360px;overflow-y:auto;border:1px solid #ddd;border-radius:3px">
      <table style="width:100%;font-size:11px">
        <thead>
          <tr>
            <th>Fecha Valor</th>
            <th>Tasa Oficial (Bs/USD)</th>
            <th>Variación Diaria</th>
            <th>Modo de Guardado</th>
            <th>Hora de Registro</th>
            <th>Fuente</th>
          </tr>
        </thead>
        <tbody>
          ${h.map(x => {
            const v = Number(x.variacion) || 0;
            const vColor = v > 0 ? '#cf1322' : (v < 0 ? '#389e0d' : '#777');
            const vSign = v > 0 ? '▲ +' : (v < 0 ? '▼ ' : '');
            return `<tr>
              <td><b>${fmtDate(x.effectiveDate)}</b></td>
              <td style="font-family:monospace;font-size:12px;font-weight:bold;color:#0b4f85">${fmtRate(x.rate)}</td>
              <td style="font-weight:bold;color:${vColor}">${v !== 0 ? `${vSign}${v.toFixed(2)}%` : '0.00%'}</td>
              <td><span class="badge ${x.tipo?.includes('Auto')?'ok':'cream'}" style="font-size:9px">${esc(x.tipo || '⚡ Auto-Guardado Diario')}</span></td>
              <td style="font-size:10px;color:#555">${x.updatedAt ? fmt(new Date(x.updatedAt)) : '—'}</td>
              <td style="font-size:9px;color:#777">${esc(x.source || 'BCV API')}</td>
            </tr>`;
          }).join('') || '<tr><td colspan="6" style="text-align:center;padding:16px">No hay histórico registrado.</td></tr>'}
        </tbody>
      </table>
    </div>
  `, `<button class="btn" onclick="closeModal()">Cerrar</button><button class="btn primary" onclick="updateBCVRate(false)">↻ Actualizar Ahora</button>`);
}

function downloadBCVHistoryCSV(){
  const h = bcvHistory();
  if(!h.length) return toast('No hay histórico para exportar');
  let csv = 'Fecha_Valor,Tasa_VES_USD,Variacion_Porcentaje,Tipo_Registro,Fecha_Hora_Captura,Fuente\n';
  h.forEach(x => {
    csv += `"${x.effectiveDate || ''}","${Number(x.rate || 0).toFixed(4)}","${(Number(x.variacion) || 0).toFixed(2)}%","${x.tipo || 'Auto'}","${x.updatedAt || ''}","${x.source || ''}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Historico_Tasas_BCV_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Histórico BCV descargado');
}

async function updateBCVRate(silent=false){
  const b=bcvData();
  try{
    if(!silent) toast('Consultando y guardando tasa BCV oficial…');
    let rate = 0;
    let effectiveDate = new Date().toISOString().slice(0,10);
    let captured = new Date().toISOString();
    let sourceUsed = bcvSource();

    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      const r = await fetch(bcvSource(), { cache: 'no-store', signal: controller.signal });
      clearTimeout(timeout);
      if(r.ok) {
        const data = await r.json();
        rate = Number(data.USD);
        effectiveDate = data.effective_date || data.date || effectiveDate;
        captured = data.updated_at || captured;
      }
    } catch(errPrimary) {
      // Intentar fallback si falla el principal
      try {
        const controller2 = new AbortController();
        const timeout2 = setTimeout(() => controller2.abort(), 8000);
        const r2 = await fetch(bcvFallbackSource(), { cache: 'no-store', signal: controller2.signal });
        clearTimeout(timeout2);
        if(r2.ok) {
          const data2 = await r2.json();
          rate = Number(data2?.monitors?.usd?.price || data2?.bcv?.price || 0);
          effectiveDate = data2?.monitors?.usd?.last_update?.slice(0,10) || effectiveDate;
          sourceUsed = bcvFallbackSource();
        }
      } catch(errSec) {
        // Fallback handled below
      }
    }

    if(!Number.isFinite(rate) || rate <= 0) {
      throw new Error('Respuesta BCV inválida');
    }

    const changed = Number(b.rate) !== rate || b.effectiveDate !== effectiveDate;
    db.config.bcv = {
      rate,
      effectiveDate,
      updatedAt: captured,
      source: sourceUsed,
      status: 'live',
      autoSaved: true
    };

    ensureBCVHistory({
      effectiveDate,
      rate,
      updatedAt: captured,
      source: sourceUsed,
      tipo: '⚡ Auto-Guardado Diario'
    });

    save();
    if(!silent) {
      closeModal();
      renderView();
      toast(changed ? `Tasa BCV del día guardada: ${fmtRate(rate)} Bs/USD` : `Tasa BCV al día (${fmtRate(rate)} Bs/USD)`);
    } else if(changed) {
      renderView();
    }
  }catch(e){
    db.config.bcv = {...b, status: 'offline'};
    ensureBCVHistory();
    save();
    if(!silent) toast('No se pudo conectar con el servicio BCV. Se conserva la última tasa guardada.');
  }
}

function maybeRefreshBCV(){
  if(bcvRefreshInFlight) return;
  const b=bcvData();
  const todayStr = new Date().toLocaleDateString('en-CA');
  const h = bcvHistory();
  const hasToday = h.some(x => x.effectiveDate === todayStr || x.effectiveDate === b.effectiveDate);
  const age = b.updatedAt ? Date.now() - new Date(b.updatedAt).getTime() : Infinity;

  // Auto-guardar si no existe la tasa de hoy o si han pasado más de 30 minutos
  if(!b.rate || !hasToday || age > 30 * 60 * 1000) {
    bcvRefreshInFlight = true;
    updateBCVRate(true).finally(() => { bcvRefreshInFlight = false; });
  }
}

function finishSale(total){

  }

  if(a2>0){const m2=document.getElementById('payMethod2')?.value||'Ninguno';if(m2==='Ninguno')return toast('Seleccione el método del segundo pago');pagos.push({metodo:m2,monto:a2});}

  const v={numero:num,fecha:fmt(),cliente:c?.nombre||'Cliente general',clienteId:saleCustomer,total:signedTotal,subtotal:total/(1+db.config.impuesto/100),impuesto:total-(total/(1+db.config.impuesto/100)),pagado:paid,saldo,tipo:isReturn?'devolucion':saleType,metodo:pagos.length>1?'Mixto':(pagos[0]?.metodo||'Crédito'),pagos,documentoOrigen:isReturn?(document.getElementById('returnOrigin')?.value||''):null,lineas:cart.map(x=>({...x}))};
  db.ventas.push(v);db.movimientos.push({fecha:fmt(),tipo:isReturn?'Devolución':'Venta',documento:num,detalle:v.cliente,monto:signedTotal,documentoOrigen:v.documentoOrigen||null});
  if(saldo){db.cxc.push({id:id('CXC','cxc'),fecha:fmt(),documento:num,clienteId:saleCustomer,cliente:v.cliente,total:amount,saldo,estado:'Pendiente'});if(c)c.saldo=(c.saldo||0)+saldo}else db.caja.saldo+=paid;
  save();cart=[];selected=null;closeModal();renderView();toast(num+(isReturn?' procesada correctamente':' registrada correctamente'));showTicketModal(v);

  const x={numero:num,fecha:fmt(),proveedor:s.nombre,proveedorId:sid,total,pagado:paid,saldo,tipo:type,lineas:[{id:pid,qty:q,costo:cost}]};
  db.compras.push(x);
  if(saldo){db.cxp.push({id:id('CXP','cxp'),fecha:fmt(),documento:num,proveedorId:sid,proveedor:s.nombre,total,saldo,estado:'Pendiente'});s.saldo=(s.saldo||0)+saldo}else db.caja.saldo-=paid;
  db.movimientos.push({fecha:fmt(),tipo:'Compra',documento:num,detalle:s.nombre,monto:paid? -paid:0});
  save();closeModal();renderView();toast(num+' registrada');
}
function clientesView(){return listPage('Clientes','Maestro de clientes, crédito y estados de cuenta',`<button class="btn primary" onclick="openClient()">➕ Nuevo cliente</button>`,`<div class="searchbar"><input placeholder="Buscar cliente o documento" oninput="filterTable(this,'clientsTable')"></div><div class="panel"><div class="panelbody"><table id="clientsTable"><thead><tr><th>Cliente</th><th>Documento</th><th>Teléfono</th><th>Límite</th><th>Saldo CxC</th><th></th></tr></thead><tbody>${db.clientes.map(c=>`<tr><td>${esc(c.nombre)}</td><td>${esc(c.documento)}</td><td>${esc(c.telefono)}</td><td>${money(c.limite)}</td><td>${money(c.saldo||0)}</td><td><button class="btn" onclick="openClient('${c.id}')">Editar</button></td></tr>`).join('')}</tbody></table></div></div>`)}
function openClient(cid){let c=cid?db.clientes.find(x=>x.id===cid):{id:'',nombre:'',documento:'',telefono:'',email:'',direccion:'',limite:0,saldo:0};openModal(cid?'Editar cliente':'Nuevo cliente',`<div class="formgrid"><div class="field"><label>Nombre / Razón social</label><input id="cNombre" value="${esc(c.nombre)}"></div><div class="field"><label>Documento</label><input id="cDoc" value="${esc(c.documento)}"></div><div class="field"><label>Teléfono</label><input id="cTel" value="${esc(c.telefono)}"></div><div class="field"><label>Correo</label><input id="cEmail" value="${esc(c.email)}"></div><div class="field"><label>Límite de crédito</label><input id="cLim" type="number" step=".01" value="${c.limite}"></div><div class="field full"><label>Dirección</label><textarea id="cDir">${esc(c.direccion)}</textarea></div></div>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveClient('${cid||''}')">Guardar</button>`)}

function proveedoresView(){return listPage('Proveedores','Maestro de proveedores y obligaciones',`<button class="btn primary" onclick="openSupplier()">➕ Nuevo proveedor</button>`,`<div class="panel"><div class="panelbody"><table><thead><tr><th>Proveedor</th><th>Documento</th><th>Teléfono</th><th>Saldo CxP</th><th></th></tr></thead><tbody>${db.proveedores.map(s=>`<tr><td>${esc(s.nombre)}</td><td>${esc(s.documento)}</td><td>${esc(s.telefono)}</td><td>${money(s.saldo||0)}</td><td><button class="btn" onclick="openSupplier('${s.id}')">Editar</button></td></tr>`).join('')}</tbody></table></div></div>`)}
function openSupplier(sid){let s=sid?db.proveedores.find(x=>x.id===sid):{id:'',nombre:'',documento:'',telefono:'',email:'',direccion:'',saldo:0};openModal(sid?'Editar proveedor':'Nuevo proveedor',`<div class="formgrid"><div class="field"><label>Nombre / Razón social</label><input id="sNombre" value="${esc(s.nombre)}"></div><div class="field"><label>Documento</label><input id="sDoc" value="${esc(s.documento)}"></div><div class="field"><label>Teléfono</label><input id="sTel" value="${esc(s.telefono)}"></div><div class="field"><label>Correo</label><input id="sEmail" value="${esc(s.email)}"></div><div class="field full"><label>Dirección</label><textarea id="sDir">${esc(s.direccion)}</textarea></div></div>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveSupplier('${sid||''}')">Guardar</button>`)}
function saveSupplier(sid){let s=sid?db.proveedores.find(x=>x.id===sid):{id:id('PV','proveedor'),saldo:0};Object.assign(s,{nombre:document.getElementById('sNombre').value.trim(),documento:document.getElementById('sDoc').value.trim(),telefono:document.getElementById('sTel').value.trim(),email:document.getElementById('sEmail').value.trim(),direccion:document.getElementById('sDir').value.trim()});if(!sid)db.proveedores.push(s);save();closeModal();renderView();toast('Proveedor guardado')}
function accountView(type){let isC=type==='cxc',a=isC?db.cxc:db.cxp;return listPage(isC?'Cuentas por Cobrar':'Cuentas por Pagar',isC?'Facturas a crédito, abonos y vencimientos':'Obligaciones con proveedores, abonos y vencimientos',null,`<div class="cards"><div class="card">Documentos<b>${a.length}</b><span>registrados</span></div><div class="card">Saldo pendiente<b>${money(a.reduce((s,x)=>s+x.saldo,0))}</b><span>por cobrar/pagar</span></div></div><div class="panel"><div class="panelbody"><table><thead><tr><th>Documento</th><th>${isC?'Cliente':'Proveedor'}</th><th>Fecha</th><th>Total</th><th>Saldo</th><th>Estado</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td>${x.documento}</td><td>${esc(isC?x.cliente:x.proveedor)}</td><td>${x.fecha}</td><td>${money(x.total)}</td><td>${money(x.saldo)}</td><td><span class="badge ${x.saldo?'warn':'ok'}">${x.saldo?'Pendiente':'Pagado'}</span></td><td>${x.saldo?`<button class="btn primary" onclick="payAccount('${type}','${x.id}')">Registrar pago</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7">No hay saldos.</td></tr>'}</tbody></table></div></div>`)}
function payAccount(type,rid){let a=(type==='cxc'?db.cxc:db.cxp).find(x=>x.id===rid);if(!a)return;openModal(type==='cxc'?'Cobro de cliente':'Pago a proveedor',`<div class="formgrid"><div class="field"><label>Documento</label><input readonly value="${a.documento}"></div><div class="field"><label>Saldo</label><input readonly value="${money(a.saldo)}"></div><div class="field"><label>Monto a aplicar</label><input id="payAccountAmt" type="number" min=".01" max="${a.saldo}" step=".01" value="${a.saldo}"></div><div class="field"><label>Método</label><select id="accountMethod"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Cheque</option></select></div></div>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="finishAccountPay('${type}','${rid}')">Aplicar pago</button>`)}
function finishAccountPay(type,rid){if(!db.caja.abierta)return toast('Abra la caja antes de registrar cobros o pagos');let a=(type==='cxc'?db.cxc:db.cxp).find(x=>x.id===rid),amt=Math.min(a.saldo,Math.max(0,Number(document.getElementById('payAccountAmt').value)||0));if(!amt)return toast('Monto inválido');a.saldo-=amt;a.estado=a.saldo?'Pendiente':'Pagado';let party=type==='cxc'?db.clientes.find(x=>x.id===a.clienteId):db.proveedores.find(x=>x.id===a.proveedorId);if(party)party.saldo=Math.max(0,(party.saldo||0)-(type==='cxc'?amt:amt));if(type==='cxc')db.caja.saldo+=amt;else db.caja.saldo-=amt;db.movimientos.push({fecha:fmt(),tipo:type==='cxc'?'Cobro CxC':'Pago CxP',documento:a.documento,detalle:type==='cxc'?a.cliente:a.proveedor,monto:amt});save();closeModal();renderView();toast('Pago aplicado')}
function presupuestosView(){return listPage('Presupuestos','Cotizaciones con conversión a venta',`<button class="btn primary" onclick="openQuote()">➕ Nuevo presupuesto</button>`,`<div class="panel"><div class="panelbody"><table><thead><tr><th>Número</th><th>Cliente</th><th>Fecha</th><th>Vigencia</th><th>Total</th><th>Estado</th><th></th></tr></thead><tbody>${db.presupuestos.map(q=>`<tr><td>${q.numero}</td><td>${esc(q.cliente)}</td><td>${q.fecha}</td><td>${q.vigencia}</td><td>${money(q.total)}</td><td><span class="badge">${q.estado}</span></td><td><button class="btn primary" onclick="quoteToSale('${q.numero}')">Convertir a venta</button></td></tr>`).join('')||'<tr><td colspan="7">No hay presupuestos.</td></tr>'}</tbody></table></div></div>`)}
function openQuote(){openModal('Nuevo presupuesto',`<div class="formgrid"><div class="field"><label>Cliente</label><select id="qClient">${db.clientes.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}</select></div><div class="field"><label>Producto</label><select id="qProduct">${db.productos.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select></div><div class="field"><label>Cantidad</label><input id="qQty" type="number" value="1" min="1"></div><div class="field"><label>Vigencia (días)</label><input id="qDays" type="number" value="15" min="1"></div></div>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveQuote()">Guardar</button>`)}
function saveQuote(){let c=db.clientes.find(x=>x.id===document.getElementById('qClient').value),p=db.productos.find(x=>x.id===document.getElementById('qProduct').value),q=Number(document.getElementById('qQty').value)||1,days=Number(document.getElementById('qDays').value)||15,sub=q*p.precio,tax=sub*db.config.impuesto/100,total=sub+tax;let d=new Date();d.setDate(d.getDate()+days);db.presupuestos.push({numero:id('PRE','presupuesto'),fecha:fmt(),vigencia:d.toLocaleDateString('es-ES'),cliente:c.nombre,clienteId:c.id,total,estado:'Pendiente',lineas:[{id:p.id,qty:q,price:p.precio}]});save();closeModal();renderView();toast('Presupuesto guardado')}
function quoteToSale(num){let q=db.presupuestos.find(x=>x.numero===num);if(!q)return;saleCustomer=q.clienteId;cart=q.lineas.map(l=>({id:l.id,qty:l.qty,price:l.price,disc:0}));saleType='contado';go('pos');toast('Presupuesto cargado en el POS')}
function reportesView(){let ventas=db.ventas.reduce((s,x)=>s+x.total,0),compras=db.compras.reduce((s,x)=>s+x.total,0),util=ventas-compras;return listPage('Reportes','Indicadores y movimientos del sistema',null,`<div class="cards"><div class="card">Ventas<b>${money(ventas)}</b><span>total registrado</span></div><div class="card">Compras<b>${money(compras)}</b><span>total registrado</span></div><div class="card">Margen bruto<b>${money(util)}</b><span>estimado sobre movimientos</span></div><div class="card">Clientes<b>${db.clientes.length}</b><span>registrados</span></div><div class="card">Proveedores<b>${db.proveedores.length}</b><span>registrados</span></div></div><div class="grid2"><div class="panel"><div class="panelhead">Ventas por documento</div><div class="panelbody">${salesTable(db.ventas.slice().reverse())}</div></div><div class="panel"><div class="panelhead">Kardex / movimientos recientes</div><div class="panelbody"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Documento</th><th>Detalle</th><th>Monto</th></tr></thead><tbody>${db.movimientos.slice(-20).reverse().map(x=>`<tr><td>${x.fecha}</td><td>${x.tipo}</td><td>${x.documento}</td><td>${esc(x.detalle)}</td><td>${money(x.monto)}</td></tr>`).join('')||'<tr><td colspan="5">Sin movimientos.</td></tr>'}</tbody></table></div></div></div>`)}
function cajaPeriodoMovimientos(){
  const since=db.caja.ultimoCorteAt?new Date(db.caja.ultimoCorteAt).getTime():0;
  return db.movimientos.filter(x=>{const t=new Date(x.fecha).getTime();return !since||Number.isNaN(t)||t>=since;});
}
function cajaResumen(){
  const since=db.caja.ultimoCorteAt?new Date(db.caja.ultimoCorteAt).getTime():0;
  const inPeriod=x=>{const t=new Date(x.fecha).getTime();return !since||Number.isNaN(t)||t>=since;};
  const ventas=db.ventas.filter(inPeriod),movs=db.movimientos.filter(inPeriod);
  const contado=ventas.filter(v=>v.tipo==='contado').reduce((s,v)=>s+(v.pagado||0),0);
  const credito=ventas.filter(v=>v.tipo==='credito').reduce((s,v)=>s+v.total,0);
  const devol=ventas.filter(v=>v.tipo==='devolucion').reduce((s,v)=>s+Math.abs(v.total),0);
  const cobros=movs.filter(x=>x.tipo==='Cobro CxC').reduce((s,x)=>s+Number(x.monto||0),0);
  const compras=movs.filter(x=>x.tipo==='Compra').reduce((s,x)=>s+Number(x.monto||0),0);
  const pagos=movs.filter(x=>x.tipo==='Pago CxP').reduce((s,x)=>s+Number(x.monto||0),0);
  return {ventas,contado,credito,devol,cobros,compras,pagos};
}
function showCorteX(){
  const r=cajaResumen();
  openModal('Corte X — Consulta de caja',`<div class="cards">

    <div class="card">Cobros CxC<b>${money(r.cobros)}</b><span>ingresos por cuentas</span></div>
    <div class="card">Devoluciones<b>${money(r.devol)}</b><span>reembolsos registrados</span></div>
    <div class="card">Compras/Pagos<b>${money(r.compras+r.pagos)}</b><span>salidas registradas</span></div>
  </div><div class="panel"><div class="panelbody"><b>Saldo actual de caja:</b> ${money(db.caja.saldo)}<br><small>El Corte X no cierra ni modifica la caja.</small></div></div>`,`<button class="btn" onclick="closeModal()">Cerrar</button><button class="btn primary" onclick="printView()">Imprimir</button>`);
}
function showCorteZ(){
  if(!db.caja.abierta)return toast('Abra la caja para ejecutar Corte Z');
  const r=cajaResumen();
  openModal('Corte Z — Cierre de caja',`<div class="cards">
    <div class="card">Ventas contado<b>${money(r.contado)}</b></div>
    <div class="card">Cobros CxC<b>${money(r.cobros)}</b></div>
    <div class="card">Devoluciones<b>${money(r.devol)}</b></div>
    <div class="card">Saldo caja<b>${money(db.caja.saldo)}</b></div>
  </div><div style="padding:9px;background:#fff8e6;border:1px solid #e6c36a;font-size:11px">El Corte Z guarda un snapshot del período y cierra la caja. Esta operación no borra ventas, inventario ni movimientos.</div>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="executeCorteZ()">Ejecutar Corte Z</button>`);
}
function executeCorteZ(){
  if(!db.caja.abierta)return toast('La caja ya está cerrada');
  const r=cajaResumen(),now=new Date(),numero='Z-'+String((db.caja.cortes?.length||0)+1).padStart(5,'0');
  db.caja.cortes=db.caja.cortes||[];
  db.caja.cortes.push({numero,fecha:fmt(),saldoFinal:db.caja.saldo,ventasContado:r.contado,cobros:r.cobros,devoluciones:r.devol,ventasCredito:r.credito});
  db.caja.ultimoCorteAt=now.toISOString();db.caja.abierta=false;db.caja.apertura=null;save();closeModal();renderView();toast(numero+' ejecutado. Caja cerrada.');
}
function cajaView(){
  return listPage('Caja y Finanzas','Apertura, movimientos y cortes X/Z',
    `<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn ${db.caja.abierta?'danger':'green'}" onclick="toggleCaja()">${db.caja.abierta?'Cerrar caja':'Abrir caja'}</button><button class="btn" onclick="showCorteX()">Corte X</button><button class="btn primary" onclick="showCorteZ()">Corte Z</button></div>`,
    `<div class="cards"><div class="card">Estado<b>${db.caja.abierta?'ABIERTA':'CERRADA'}</b><span>${db.caja.apertura||'Sin apertura'}</span></div><div class="card">Saldo de caja<b>${money(db.caja.saldo)}</b><span>movimiento neto</span></div><div class="card">Cortes Z<b>${db.caja.cortes?.length||0}</b><span>cierres registrados</span></div></div>

}

function configView(){return listPage('Configuración','Parámetros generales del sistema',`<button class="btn primary" onclick="saveConfig()">Guardar configuración</button>`,`<div class="panel"><div class="panelbody"><div class="formgrid"><div class="field"><label>Nombre de empresa</label><input id="cfgEmpresa" value="${esc(db.config.empresa)}"></div><div class="field"><label>Moneda</label><select id="cfgMoneda"><option ${db.config.moneda==='USD'?'selected':''}>USD</option><option ${db.config.moneda==='EUR'?'selected':''}>EUR</option><option ${db.config.moneda==='VES'?'selected':''}>VES</option></select></div><div class="field"><label>Impuesto (%)</label><input id="cfgTax" type="number" step=".01" value="${db.config.impuesto}"></div></div></div></div><div class="panel"><div class="panelhead">Datos</div><div class="panelbody"><button class="btn danger" onclick="resetData()">Restablecer datos de demostración</button></div></div>`)}
function saveConfig(){db.config.empresa=document.getElementById('cfgEmpresa').value.trim()||'SIFER 360';db.config.moneda=document.getElementById('cfgMoneda').value;db.config.impuesto=Number(document.getElementById('cfgTax').value)||0;save();renderShell();toast('Configuración guardada')}
function resetData(){
  const confirmation=prompt('Esta acción elimina los datos locales actuales y restaura datos de demostración. Escriba BORRAR SIFER para confirmar.');
  if(confirmation!=='BORRAR SIFER')return toast('Restablecimiento cancelado');

function normalizeSearchText(s){return s?String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''):''}
function matchKeywords(text,query){if(!query||!query.trim())return true;if(!text)return false;const normText=normalizeSearchText(text),tokens=normalizeSearchText(query).trim().split(/\s+/).filter(Boolean);return tokens.every(t=>normText.includes(t))}
function filterTable(inp,id){let q=inp.value;document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=matchKeywords(r.textContent,q)?'':'none')}
function openModal(title,body,foot){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFoot').innerHTML=foot||'';document.getElementById('modal').classList.add('show')}

 if(!document.fullscreenElement){
  (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen||document.documentElement.msRequestFullscreen)?.call(document.documentElement).catch(()=>{toast('No se pudo activar pantalla completa')});
 }else{
  (document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen)?.call(document);
 }
}
document.addEventListener('fullscreenchange',()=>{
 const b=document.getElementById('btnFullscreen');
 if(b) b.innerHTML = document.fullscreenElement ? '🗗 Salir de Pantalla Completa' : '⛶ Pantalla Completa';
});
